
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار هوشمند من</title>
<style>
body{margin:0;background:#f2f4f7;font-family:tahoma}
header{background:#172554;color:white;padding:18px;text-align:center}
main{max-width:650px;margin:25px auto;padding:15px}
.panel{background:white;padding:20px;border-radius:14px;margin-bottom:15px}
input{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:9px}
button{padding:12px 20px;background:#1d4ed8;color:white;border:0;border-radius:9px;cursor:pointer}
#chat{display:none;min-height:50vh}
.msg{padding:12px;margin:10px 0;border-radius:10px;line-height:1.8;white-space:pre-wrap}
.user{background:#dbeafe}
.bot{background:#eee}
#form{display:flex;gap:8px}
#form input{flex:1}
#status{color:#b91c1c}
</style>
</head>
<body>
<header>
<h2>دستیار هوشمند من</h2>
<p>مرکز مدیریت کسب‌وکار</p>
</header>
<main>
<section class="panel" id="login">
<h3>ورود به حساب</h3>
<input id="username" placeholder="نام کاربری">
<input id="password" type="password" placeholder="رمز عبور">
<button id="loginButton">ورود</button>
<p id="status"></p>
</section>

<section class="panel" id="chat">
<p id="welcome"></p>
<button id="logoutButton">خروج</button>
<div id="messages">
<div class="msg bot">سلام! آماده‌ام.</div>
</div>
<form id="form">
<input id="message" placeholder="پیامت را بنویس..." autocomplete="off">
<button id="send" type="submit">ارسال</button>
</form>
</section>
</main>
<script src="/app.js" defer></script>
</body>
</html>
