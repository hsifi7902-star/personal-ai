<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار هوشمند من</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;font-family:tahoma,Arial}
header{background:#172554;color:white;padding:20px;text-align:center}
main{max-width:700px;margin:25px auto;padding:15px}
#chat{background:white;border-radius:14px;padding:15px;min-height:60vh}
.msg{padding:12px;margin:10px 0;border-radius:12px;max-width:85%;line-height:1.9}
.user{background:#dbeafe;margin-right:auto}
.bot{background:#eee;margin-left:auto}
form{display:flex;gap:8px;margin-top:15px}
input{flex:1;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{padding:12px 20px;background:#1d4ed8;color:white;border:0;border-radius:10px}
</style>
</head>
<body>
<header>
<h2>دستیار هوشمند من</h2>
<p>مرکز مدیریت کسب‌وکار</p>
</header>
<main>
<div id="chat">
<div class="msg bot">سلام! آماده‌ام اطلاعات کسب‌وکارت را دریافت کنم.</div>
</div>
<form id="form">
<input id="message" placeholder="پیامت را بنویس..." autocomplete="off">
<button type="submit">ارسال</button>
</form>
</main>
<script>
const form=document.getElementById("form");
const input=document.getElementById("message");
const chat=document.getElementById("chat");

form.addEventListener("submit",function(e){
e.preventDefault();
const value=input.value.trim();
if(!value)return;
const msg=document.createElement("div");
msg.className="msg user";
msg.textContent=value;
chat.appendChild(msg);
input.value="";
chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
